<dialog id="cite-dialog" aria-labelledby="cite-title">
  <div class="dialog-head">
    <h2 id="cite-title">Cite</h2>
    <button type="button" class="icon-btn" data-close aria-label="Close">{{ partial "icon.html" "close" }}</button>
  </div>
  <pre><code id="cite-code"></code></pre>
  <div class="dialog-actions">
    <button type="button" class="btn" id="cite-copy">{{ partial "icon.html" "copy" }}<span>Copy</span></button>
    <a class="btn btn-outline" id="cite-download" download>{{ partial "icon.html" "download" }}Download</a>
  </div>
</dialog>
