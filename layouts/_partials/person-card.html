{{- $p := . }}
<div class="person">
  {{- with $p.Resources.GetMatch "avatar.*" }}
    {{- $a := .Fill "300x300 Center q80" }}
    <a href="{{ $p.RelPermalink }}" tabindex="-1" aria-hidden="true"><img class="avatar" src="{{ $a.RelPermalink }}" width="150" height="150" alt="" loading="lazy"></a>
  {{- end }}
  <div class="portrait-title">
    <h2><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h2>
    {{- with $p.Params.role }}<h3>{{ . }}</h3>{{ end }}
    {{ partial "person-links.html" $p }}
  </div>
</div>
