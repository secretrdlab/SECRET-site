{{ define "main" }}
<article class="article-container">
  <h1>{{ .Title }}</h1>
  {{- if eq .Section "post" }}
  <div class="meta article-meta">{{ .Date.Format "Jan 2, 2006" }} <span class="sep">·</span> {{ .ReadingTime }} min read</div>
  {{- end }}
  <div class="article-style">
    {{ .Content }}
  </div>
</article>
{{ end }}
