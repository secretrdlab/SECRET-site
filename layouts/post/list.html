{{ define "main" }}
<div class="universal-wrapper">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="post-list">
    {{- range .Paginator.Pages }}
    <div class="post-item">
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <div class="post-summary">{{ .Summary | plainify }}</div>
      <div class="meta">{{ .Date.Format "Jan 2, 2006" }} <span class="sep">·</span> {{ .ReadingTime }} min read</div>
    </div>
    {{- end }}
  </div>
  {{ partial "pagination.html" . }}
</div>
{{ end }}
