# Builds the site and publishes it to GitHub Pages on every push to main.
# Pull requests are built and checked (BibTeX + links) but not published.
name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a publish half-way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.152.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Validate BibTeX
        run: python scripts/bib2data.py --check

      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tgz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      # Gives the site's public address: https://secret.seg.br once the custom domain is set
      # in Settings → Pages, https://secretrdlab.github.io/SECRET-site before that.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/bib2data.py
          hugo --gc --minify --panicOnWarning --baseURL "${BASE_URL:-https://secret.seg.br}/"

      - name: Check links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python scripts/check_site.py public "${BASE_PATH}"

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
